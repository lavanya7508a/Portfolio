<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Dustbin – AI-Enabled Fill-Level Monitoring System</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚮</text></svg>">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            forest: '#123524',
            'forest-light': '#1b4933',
            leaf: '#2F6B45',
            'leaf-light': '#5C9A6B',
            lime: '#C8E45C',
            'lime-dim': '#b5d14a',
            paper: '#F8F9FA',
            tint: '#F4F1E6',
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel for standalone execution -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body class="bg-[#F0F3F1] text-[#14261B] min-h-screen">
  <div id="root"></div>

  <!-- React Application Source -->
  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // --- Sound alert helper (Web Audio API) ---
    function playWarningBeep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, ctx.currentTime); // A5 tone
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
        osc.start();
        osc.stop(ctx.currentTime + 0.35);
      } catch (e) {
        console.warn('Audio not allowed or supported:', e);
      }
    }

    // --- Main App Component ---
    function App() {
      // Navigation state (8 pages)
      // 'dashboard', 'monitoring', 'ai_vision', 'alerts', 'collections', 'reports', 'settings', 'login'
      const [currentTab, setCurrentTab] = useState('dashboard');
      const [currentUser, setCurrentUser] = useState({
        name: 'Lavanya A',
        role: 'Municipal Supervisor',
        empId: '25105116-CSE',
        site: 'Goundanur, Coimbatore'
      });
      const [isLoggedIn, setIsLoggedIn] = useState(true);

      // Data states
      const [stats, setStats] = useState({
        total_bins: 4,
        normal_bins: 2,
        warning_bins: 1,
        overflow_bins: 1,
        average_fill_level: 73.8,
        active_alerts_count: 2,
        pending_collections_count: 1,
        avg_response_time_min: 52.0
      });
      const [bins, setBins] = useState([]);
      const [alerts, setAlerts] = useState([]);
      const [collections, setCollections] = useState([]);
      const [staffList, setStaffList] = useState([]);
      const [loading, setLoading] = useState(true);
      const [soundEnabled, setSoundEnabled] = useState(true);
      const [toast, setToast] = useState(null);

      // Modals
      const [smsModalData, setSmsModalData] = useState(null);
      const [dispatchModalBin, setDispatchModalBin] = useState(null);

      // Toast helper
      const showToast = (message, type = 'info') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 4000);
      };

      // Initial load & Polling
      const fetchData = async () => {
        try {
          const [resStats, resBins, resAlerts, resCols] = await Promise.all([
            fetch('/api/dashboard/stats').then(r => r.json()),
            fetch('/api/bins').then(r => r.json()),
            fetch('/api/alerts').then(r => r.json()),
            fetch('/api/collections').then(r => r.json()),
          ]);

          if (resStats.success) setStats(resStats.stats);
          if (resBins.success) setBins(resBins.bins);
          if (resAlerts.success) setAlerts(resAlerts.alerts);
          if (resCols.success) {
            setCollections(resCols.collections);
            setStaffList(resCols.staff);
          }
        } catch (err) {
          console.error('Fetch error:', err);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchData();
        const interval = setInterval(fetchData, 4000);
        return () => clearInterval(interval);
      }, []);

      // Simulation: Step bin fill level
      const handleStepFill = async (binId, delta) => {
        try {
          const res = await fetch(`/api/bins/${binId}/step`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ delta })
          }).then(r => r.json());

          if (res.success) {
            showToast(`${binId} fill adjusted to ${res.bin.current_fill_pct}% (${res.bin.status})`, 'success');
            if (res.bin.current_fill_pct >= 80 && soundEnabled) playWarningBeep();
            fetchData();
          }
        } catch (e) {
          showToast('Failed to update telemetry', 'error');
        }
      };

      // Empty bin
      const handleEmptyBin = async (binId) => {
        try {
          const res = await fetch(`/api/bins/${binId}/empty`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ notes: 'Emptied via dashboard action' })
          }).then(r => r.json());

          if (res.success) {
            showToast(`${binId} emptied! Fill level reset to 0%. Alerts resolved.`, 'success');
            fetchData();
          }
        } catch (e) {
          showToast('Failed to empty bin', 'error');
        }
      };

      // Resolve Alert
      const handleResolveAlert = async (alertId) => {
        try {
          const res = await fetch(`/api/alerts/${alertId}/resolve`, { method: 'POST' }).then(r => r.json());
          if (res.success) {
            showToast('Alert marked as resolved', 'success');
            fetchData();
          }
        } catch (e) {
          showToast('Failed to resolve alert', 'error');
        }
      };

      // Trigger Simulated SMS
      const handleTriggerSms = async (binId, alertMsg) => {
        try {
          const res = await fetch('/api/alerts/simulate-sms', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              bin_id: binId,
              message: alertMsg || `ALERT: Dustbin ${binId} has exceeded 80% threshold at Goundanur. Please dispatch collection.`
            })
          }).then(r => r.json());

          if (res.success) {
            setSmsModalData(res.receipt);
            showToast('Dispatch SMS sent to sanitation staff phone!', 'success');
          }
        } catch (e) {
          showToast('Failed to simulate SMS', 'error');
        }
      };

      // Complete Collection
      const handleCompleteCollection = async (collectionId) => {
        try {
          const res = await fetch(`/api/collections/${collectionId}/complete`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ notes: 'Verified and cleared by collection team.' })
          }).then(r => r.json());

          if (res.success) {
            showToast(`Collection completed! Response time: ${res.collection.response_time_min} mins.`, 'success');
            fetchData();
          }
        } catch (e) {
          showToast('Failed to complete collection', 'error');
        }
      };

      // Dispatch Collection
      const handleDispatchCollection = async (binId, staffId) => {
        try {
          const res = await fetch('/api/collections/create', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ bin_id: binId, staff_id: staffId })
          }).then(r => r.json());

          if (res.success) {
            showToast(`Crew dispatched to ${binId}!`, 'success');
            setDispatchModalBin(null);
            fetchData();
          }
        } catch (e) {
          showToast('Dispatch failed', 'error');
        }
      };

      // Reset Database
      const handleResetDb = async () => {
        if (!confirm('Are you sure you want to reset the database and seed fresh Goundanur demo data?')) return;
        try {
          const res = await fetch('/api/settings/reset', { method: 'POST' }).then(r => r.json());
          if (res.success) {
            showToast('Database reset to initial pilot state!', 'success');
            fetchData();
          }
        } catch (e) {
          showToast('Reset failed', 'error');
        }
      };

      // Simulation tick
      const handleSimulateTick = async () => {
        try {
          const res = await fetch('/api/simulation/tick', { method: 'POST' }).then(r => r.json());
          if (res.success) {
            showToast('Simulated waste accumulation (+2% to +7%) across bins.', 'info');
            fetchData();
          }
        } catch (e) {
          showToast('Tick failed', 'error');
        }
      };

      return (
        <div className="flex min-h-screen">
          {/* SIDEBAR NAVIGATION */}
          <aside className="w-64 bg-[#123524] text-white flex flex-col fixed top-0 bottom-0 left-0 z-40 border-r border-[#C8E45C]/20">
            <div className="p-5 border-b border-white/10 flex items-center gap-3">
              <div className="w-10 h-10 bg-[#C8E45C] text-[#123524] rounded-xl flex items-center justify-center font-extrabold text-xl shadow-lg">
                🚮
              </div>
              <div>
                <h1 className="font-bold text-base text-white leading-tight">Smart Dustbin</h1>
                <p className="text-[10px] text-[#C8E45C] font-mono tracking-wider uppercase">AI Fill-Level Monitor</p>
              </div>
            </div>

            {/* Context Badge */}
            <div className="mx-4 mt-3 p-2.5 rounded-lg bg-[#2F6B45]/40 border border-[#C8E45C]/20 text-[11.5px]">
              <div className="text-[#C8E45C] font-semibold flex items-center gap-1.5">
                <span className="w-2 h-2 rounded-full bg-[#C8E45C]"></span>
                Field Study Pilot
              </div>
              <p className="text-gray-300 mt-0.5 text-[11px]">Goundanur, Coimbatore</p>
            </div>

            {/* Nav Menu (8 Pages) */}
            <nav className="flex-1 px-3 py-4 space-y-1 overflow-y-auto">
              {[
                { id: 'dashboard', label: 'Dashboard', icon: '📊' },
                { id: 'monitoring', label: 'Dustbin Monitoring', icon: '🗑️' },
                { id: 'ai_vision', label: 'AI Overflow Detection', icon: '👁️' },
                { id: 'alerts', label: 'Alerts', icon: '🚨', badge: stats.active_alerts_count },
                { id: 'collections', label: 'Collection Management', icon: '🚚', badge: stats.pending_collections_count },
                { id: 'reports', label: 'Reports & Analytics', icon: '📈' },
                { id: 'settings', label: 'Hardware & Simulation', icon: '⚙️' },
                { id: 'login', label: 'Demo Login / Profile', icon: '👤' },
              ].map(item => (
                <button
                  key={item.id}
                  onClick={() => setCurrentTab(item.id)}
                  className={`w-full flex items-center justify-between px-3.5 py-2.5 rounded-lg text-[13.5px] font-medium transition-all text-left ${
                    currentTab === item.id
                      ? 'bg-[#2F6B45] text-[#C8E45C] font-semibold border border-[#C8E45C]/30 shadow-sm'
                      : 'text-gray-300 hover:bg-white/5 hover:text-white'
                  }`}
                >
                  <div className="flex items-center gap-2.5">
                    <span className="text-base">{item.icon}</span>
                    <span>{item.label}</span>
                  </div>
                  {item.badge > 0 && (
                    <span className="bg-red-600 text-white text-[11px] font-bold px-2 py-0.5 rounded-full">
                      {item.badge}
                    </span>
                  )}
                </button>
              ))}
            </nav>

            {/* User Profile Footer */}
            <div className="p-4 border-t border-white/10 bg-black/20">
              <div className="flex items-center gap-3">
                <div className="w-8 h-8 rounded-full bg-[#5C9A6B] text-white flex items-center justify-center font-bold text-xs">
                  {currentUser.name.charAt(0)}
                </div>
                <div className="flex-1 min-w-0">
                  <p className="text-xs font-semibold text-white truncate">{currentUser.name}</p>
                  <p className="text-[10px] text-[#C8E45C] font-mono truncate">{currentUser.role}</p>
                </div>
                <button
                  onClick={() => setCurrentTab('login')}
                  title="Switch Role / Login"
                  className="text-gray-400 hover:text-white p-1 text-xs"
                >
                  ⇄
                </button>
              </div>
            </div>
          </aside>

          {/* MAIN CONTENT AREA */}
          <main className="ml-64 flex-1 flex flex-col min-h-screen">
            {/* Top Navigation Bar */}
            <header className="h-16 bg-white border-b border-[#14261B]/10 px-8 flex items-center justify-between sticky top-0 z-30 shadow-sm">
              <div className="flex items-center gap-3">
                <span className="font-mono text-xs text-[#2F6B45] bg-[#F4F1E6] px-2.5 py-1 rounded font-semibold border border-[#14261B]/10">
                  GOUNDANUR PILOT
                </span>
                <h2 className="text-lg font-bold text-[#14261B] capitalize">
                  {currentTab.replace('_', ' ')}
                </h2>
              </div>

              <div className="flex items-center gap-4">
                {/* Live System Online Badge */}
                <div className="flex items-center gap-2 text-xs font-mono text-[#2F6B45] bg-emerald-50 px-3 py-1.5 rounded-full border border-emerald-200">
                  <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                  IoT Server Online (Port 5000)
                </div>

                {/* Quick Simulation Stepper */}
                <button
                  onClick={handleSimulateTick}
                  className="bg-[#F4F1E6] hover:bg-[#EAE5D4] text-[#123524] text-xs font-semibold px-3 py-1.5 rounded-lg border border-[#14261B]/15 flex items-center gap-1.5 transition"
                  title="Simulate random waste disposal to advance fill levels"
                >
                  <span>⚡</span> Auto-Fill Step
                </button>

                {/* Sound alert toggle */}
                <button
                  onClick={() => {
                    setSoundEnabled(!soundEnabled);
                    showToast(soundEnabled ? 'Alert audio muted' : 'Alert audio enabled', 'info');
                  }}
                  className={`p-1.5 rounded-lg border text-sm transition ${
                    soundEnabled
                      ? 'bg-[#C8E45C]/30 border-[#C8E45C] text-[#123524]'
                      : 'bg-gray-100 border-gray-300 text-gray-400'
                  }`}
                  title={soundEnabled ? 'Warning sounds enabled' : 'Muted'}
                >
                  {soundEnabled ? '🔔' : '🔕'}
                </button>

                {/* Current Time Badge */}
                <div className="text-xs font-mono text-gray-500 hidden md:block">
                  {new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })} IST
                </div>
              </div>
            </header>

            {/* PAGE VIEW ROUTER */}
            <div className="p-8 flex-1 animate-fade-in">
              {currentTab === 'dashboard' && (
                <DashboardView
                  stats={stats}
                  bins={bins}
                  alerts={alerts}
                  collections={collections}
                  onStepFill={handleStepFill}
                  onEmptyBin={handleEmptyBin}
                  onResolveAlert={handleResolveAlert}
                  onTriggerSms={handleTriggerSms}
                  onOpenDispatch={(bin) => setDispatchModalBin(bin)}
                  onNavigate={setCurrentTab}
                />
              )}

              {currentTab === 'monitoring' && (
                <MonitoringView
                  bins={bins}
                  onStepFill={handleStepFill}
                  onEmptyBin={handleEmptyBin}
                  onOpenDispatch={(bin) => setDispatchModalBin(bin)}
                />
              )}

              {currentTab === 'ai_vision' && (
                <AiVisionView
                  bins={bins}
                  showToast={showToast}
                  onOpenDispatch={(bin) => setDispatchModalBin(bin)}
                />
              )}

              {currentTab === 'alerts' && (
                <AlertsView
                  alerts={alerts}
                  onResolve={handleResolveAlert}
                  onTriggerSms={handleTriggerSms}
                />
              )}

              {currentTab === 'collections' && (
                <CollectionsView
                  collections={collections}
                  staffList={staffList}
                  bins={bins}
                  onComplete={handleCompleteCollection}
                  onDispatch={handleDispatchCollection}
                />
              )}

              {currentTab === 'reports' && (
                <ReportsView
                  bins={bins}
                  collections={collections}
                  showToast={showToast}
                />
              )}

              {currentTab === 'settings' && (
                <SettingsView
                  bins={bins}
                  soundEnabled={soundEnabled}
                  setSoundEnabled={setSoundEnabled}
                  onResetDb={handleResetDb}
                  onSimulateTick={handleSimulateTick}
                  onUpdateFill={handleStepFill}
                  showToast={showToast}
                />
              )}

              {currentTab === 'login' && (
                <LoginView
                  currentUser={currentUser}
                  setCurrentUser={setCurrentUser}
                  setIsLoggedIn={setIsLoggedIn}
                  showToast={showToast}
                  onNavigate={setCurrentTab}
                />
              )}
            </div>
          </main>

          {/* SMS SIMULATION MODAL */}
          {smsModalData && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full overflow-hidden shadow-2xl border border-gray-200 animate-fade-in">
                <div className="bg-[#123524] text-white p-5 flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <span className="text-xl">📱</span>
                    <h3 className="font-bold text-base text-[#C8E45C]">SMS Dispatch Notification</h3>
                  </div>
                  <button onClick={() => setSmsModalData(null)} className="text-gray-400 hover:text-white text-lg">✕</button>
                </div>
                <div className="p-6 space-y-4">
                  <div className="bg-emerald-50 border border-emerald-200 rounded-lg p-3 text-xs text-emerald-800 flex items-center gap-2">
                    <span className="w-2 h-2 rounded-full bg-emerald-500"></span>
                    Gateway Status: <strong className="font-mono">{smsModalData.status}</strong>
                  </div>
                  <div>
                    <label className="text-[11px] font-mono text-gray-500 uppercase">Recipient</label>
                    <p className="font-semibold text-sm text-[#14261B]">{smsModalData.recipient}</p>
                  </div>
                  <div>
                    <label className="text-[11px] font-mono text-gray-500 uppercase">Timestamp</label>
                    <p className="font-mono text-xs text-gray-600">{smsModalData.timestamp}</p>
                  </div>
                  <div>
                    <label className="text-[11px] font-mono text-gray-500 uppercase">SMS Message Payload</label>
                    <div className="bg-[#F4F1E6] p-3 rounded-lg border border-[#14261B]/15 text-xs text-[#14261B] font-mono leading-relaxed mt-1">
                      {smsModalData.message}
                    </div>
                  </div>
                </div>
                <div className="p-4 bg-gray-50 border-t flex justify-end">
                  <button
                    onClick={() => setSmsModalData(null)}
                    className="bg-[#123524] text-[#C8E45C] text-xs font-semibold px-4 py-2 rounded-lg hover:bg-[#1b4933]"
                  >
                    Close Notification
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* DISPATCH TEAM MODAL */}
          {dispatchModalBin && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full overflow-hidden shadow-2xl border border-gray-200 animate-fade-in">
                <div className="bg-[#123524] text-white p-5 flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <span className="text-xl">🚚</span>
                    <h3 className="font-bold text-base text-[#C8E45C]">Dispatch Collection Crew</h3>
                  </div>
                  <button onClick={() => setDispatchModalBin(null)} className="text-gray-400 hover:text-white text-lg">✕</button>
                </div>
                <form onSubmit={(e) => {
                  e.preventDefault();
                  const staffId = e.target.staff_id.value;
                  handleDispatchCollection(dispatchModalBin.id, staffId);
                }} className="p-6 space-y-4">
                  <div>
                    <label className="text-xs font-semibold text-gray-600">Target Dustbin</label>
                    <div className="p-3 bg-gray-50 rounded-lg border text-sm font-bold text-[#14261B] mt-1">
                      {dispatchModalBin.id} – {dispatchModalBin.location} ({dispatchModalBin.current_fill_pct}% Full)
                    </div>
                  </div>
                  <div>
                    <label className="text-xs font-semibold text-gray-600">Assign Sanitation Crew</label>
                    <select name="staff_id" className="w-full mt-1 p-2.5 border rounded-lg text-sm bg-white font-medium">
                      {staffList.map(s => (
                        <option key={s.id} value={s.id}>
                          {s.name} ({s.role} - Vehicle: {s.vehicle_id}) [{s.status}]
                        </option>
                      ))}
                    </select>
                  </div>
                  <div className="p-4 bg-gray-50 -mx-6 -mb-6 mt-6 border-t flex justify-end gap-2">
                    <button
                      type="button"
                      onClick={() => setDispatchModalBin(null)}
                      className="px-4 py-2 border rounded-lg text-xs font-semibold hover:bg-gray-100"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="bg-[#123524] text-[#C8E45C] px-5 py-2 rounded-lg text-xs font-bold hover:bg-[#1b4933]"
                    >
                      Confirm & Dispatch Team
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* TOAST NOTIFICATION */}
          {toast && (
            <div className="fixed bottom-6 right-6 z-50 bg-[#123524] text-white px-5 py-3.5 rounded-xl shadow-2xl border-l-4 border-[#C8E45C] flex items-center gap-3 text-xs animate-fade-in max-w-md">
              <span className="text-base">{toast.type === 'error' ? '⚠️' : '✅'}</span>
              <p className="font-medium">{toast.message}</p>
            </div>
          )}
        </div>
      );
    }

    // -------------------------------------------------------------
    // 1. DASHBOARD VIEW COMPONENT
    // -------------------------------------------------------------
    function DashboardView({ stats, bins, alerts, collections, onStepFill, onEmptyBin, onResolveAlert, onTriggerSms, onOpenDispatch, onNavigate }) {
      const chartRef = useRef(null);
      const chartInstance = useRef(null);

      // Render Trend Chart
      useEffect(() => {
        if (!chartRef.current) return;
        if (chartInstance.current) chartInstance.current.destroy();

        const ctx = chartRef.current.getContext('2d');
        chartInstance.current = new Chart(ctx, {
          type: 'line',
          data: {
            labels: ['06:00 AM', '08:00 AM', '10:00 AM', '12:00 PM (Midday)', '02:00 PM', '04:00 PM', 'Now'],
            datasets: [
              {
                label: 'BIN-001 (Main Entrance)',
                data: [18, 28, 42, 60, 78, 84, bins.find(b => b.id === 'BIN-001')?.current_fill_pct || 85],
                borderColor: '#D97706',
                backgroundColor: 'rgba(217, 119, 6, 0.08)',
                tension: 0.35,
                borderWidth: 2.5,
              },
              {
                label: 'BIN-002 (Public Area)',
                data: [22, 35, 54, 72, 86, 93, bins.find(b => b.id === 'BIN-002')?.current_fill_pct || 95],
                borderColor: '#DC2626',
                backgroundColor: 'rgba(220, 38, 38, 0.08)',
                tension: 0.35,
                borderWidth: 2.5,
              },
              {
                label: 'BIN-003 (Street 1)',
                data: [10, 15, 20, 28, 35, 40, bins.find(b => b.id === 'BIN-003')?.current_fill_pct || 45],
                borderColor: '#16A34A',
                backgroundColor: 'transparent',
                tension: 0.35,
                borderWidth: 2,
              },
              {
                label: 'BIN-004 (Street 2)',

    // -------------------------------------------------------------
    // 3. AI OVERFLOW DETECTION VIEW
    // -------------------------------------------------------------
    function AiVisionView({ bins, showToast, onOpenDispatch }) {
      const [selectedPreset, setSelectedPreset] = useState('overflow_spill');
      const [aiMode, setAiMode] = useState('hybrid');
      const [selectedBinId, setSelectedBinId] = useState('BIN-002');
      const [analyzing, setAnalyzing] = useState(false);
      const [detectionResult, setDetectionResult] = useState(null);
      const [uploadedFile, setUploadedFile] = useState(null);
      const [previewUrl, setPreviewUrl] = useState('/static/img/samples/sample_overflow_spill.jpg');

      const fileInputRef = useRef(null);

      // Run detection
      const runDetection = async (presetId = null, file = null) => {
        setAnalyzing(true);
        try {
          const formData = new FormData();
          formData.append('mode', aiMode);
          if (selectedBinId) formData.append('bin_id', selectedBinId);

          if (file) {
            formData.append('image', file);
          } else if (presetId) {
            formData.append('sample_id', presetId);
          } else if (selectedPreset) {
            formData.append('sample_id', selectedPreset);
          }

          const res = await fetch('/api/ai/detect', {
            method: 'POST',
            body: formData
          }).then(r => r.json());

          if (res.success) {
            setDetectionResult(res.result);
            setPreviewUrl(res.result.annotated_image_url || res.result.original_image_url);
            showToast('Image analysis complete!', 'success');
          } else {
            showToast(res.error || 'Detection failed', 'error');
          }
        } catch (e) {
          showToast('Detection request error', 'error');
        } finally {
          setAnalyzing(false);
        }
      };

      // Run on mount
      useEffect(() => {
        runDetection('overflow_spill');
      }, []);

      const handlePresetClick = (preset) => {
        setSelectedPreset(preset);
        setUploadedFile(null);
        runDetection(preset, null);
      };

      const handleFileChange = (e) => {
        const file = e.target.files[0];
        if (file) {
          setUploadedFile(file);
          setSelectedPreset(null);
          runDetection(null, file);
        }
      };

      return (
        <div className="space-y-6">
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-3">
            <div>
              <h2 className="text-xl font-bold text-[#14261B]">AI Vision Waste Overflow & Spillage Detection</h2>
              <p className="text-xs text-gray-500">
                Camera-based computer vision verifying visual waste spillage on sidewalks & overflowing rims
              </p>
            </div>
            {/* Mode selection badge */}
            <div className="flex items-center gap-2 bg-white px-3 py-1.5 rounded-lg border text-xs">
              <span className="text-gray-500 font-medium">Vision Engine:</span>
              <select
                value={aiMode}
                onChange={(e) => setAiMode(e.target.value)}
                className="font-bold text-[#123524] bg-transparent outline-none cursor-pointer"
              >
                <option value="hybrid">AI Hybrid (OpenCV + Feature Model)</option>
                <option value="opencv">Real OpenCV Contour & Edge Density</option>
                <option value="simulated_yolo">Simulated YOLOv8-Waste Model</option>
              </select>
            </div>
          </div>

          {/* Presets Bar */}
          <div className="bg-white p-4 rounded-xl border border-[#14261B]/10 shadow-sm flex flex-wrap items-center justify-between gap-3">
            <div className="flex items-center gap-2">
              <span className="text-xs font-bold text-gray-700">1-Click Test Samples:</span>
              {[
                { id: 'clean', label: '1. Clean Dustbin (Normal)', icon: '🟢' },
                { id: 'near_full', label: '2. Near Capacity (80%)', icon: '🟡' },
                { id: 'overflow_spill', label: '3. Severe Overflow & Spillage', icon: '🔴' },
                { id: 'scattered_litter', label: '4. Scattered Ground Litter', icon: '🟠' },
              ].map(p => (
                <button
                  key={p.id}
                  onClick={() => handlePresetClick(p.id)}
                  className={`text-xs px-3 py-1.5 rounded-lg font-medium transition flex items-center gap-1.5 ${
                    selectedPreset === p.id
                      ? 'bg-[#123524] text-[#C8E45C] font-bold shadow'
                      : 'bg-[#F4F1E6] text-gray-700 hover:bg-gray-200'
                  }`}
                >
                  <span>{p.icon}</span>
                  <span>{p.label}</span>
                </button>
              ))}
            </div>

            {/* Custom Upload Trigger */}
            <div>
              <input
                type="file"
                ref={fileInputRef}
                onChange={handleFileChange}
                accept="image/*"
                className="hidden"
              />
              <button
                onClick={() => fileInputRef.current?.click()}
                className="text-xs font-bold bg-[#2F6B45] text-white px-3.5 py-1.5 rounded-lg hover:bg-[#123524] transition flex items-center gap-1"
              >
                <span>📤</span> Upload Custom Image
              </button>
            </div>
          </div>

          {/* Main AI Workbench Grid */}
          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
            {/* Left: Image Viewer with Annotations */}
            <div className="lg:col-span-7 bg-white p-5 rounded-2xl border border-[#14261B]/10 shadow-sm flex flex-col items-center justify-center min-h-[420px] relative">
              {analyzing ? (
                <div className="text-center py-16 space-y-3">
                  <div className="w-12 h-12 border-4 border-[#123524] border-t-[#C8E45C] rounded-full animate-spin mx-auto"></div>
                  <p className="font-mono text-xs text-gray-600">Running Computer Vision Inference & Contour Extraction...</p>
                </div>
              ) : (
                <div className="w-full h-full flex flex-col items-center">
                  <div className="relative max-h-[400px] w-full flex items-center justify-center bg-gray-900 rounded-xl overflow-hidden">
                    <img
                      src={previewUrl}
                      alt="AI Detection Preview"
                      className="max-h-[380px] max-w-full object-contain rounded-lg"
                    />
                  </div>
                  <p className="text-[11px] text-gray-400 font-mono mt-2">
                    Annotated with detected waste bounding boxes, edge contours & confidence ratings
                  </p>
                </div>
              )}
            </div>

            {/* Right: Detailed Detection Report Card */}
            <div className="lg:col-span-5 bg-white p-6 rounded-2xl border border-[#14261B]/10 shadow-sm flex flex-col justify-between space-y-5">
              {detectionResult ? (
                <div className="space-y-4">
                  {/* Status Banner */}
                  <div className={`p-4 rounded-xl border flex items-center justify-between ${
                    detectionResult.overflow_detected
                      ? 'bg-red-50 border-red-200 text-red-800'
                      : 'bg-emerald-50 border-emerald-200 text-emerald-800'
                  }`}>
                    <div>
                      <p className="text-[10px] font-mono uppercase tracking-wider">Detection Verdict</p>
                      <h3 className="text-lg font-bold">{detectionResult.status}</h3>
                    </div>
                    <div className="text-right">

      ];

      return (
        <div className="max-w-xl mx-auto space-y-6 pt-6">
          <div className="bg-white p-8 rounded-2xl border border-[#14261B]/10 shadow-lg space-y-6 text-center">
            <div className="w-16 h-16 bg-[#123524] text-[#C8E45C] rounded-2xl flex items-center justify-center text-3xl mx-auto shadow-md">
              🚮
            </div>
            <div>
              <h2 className="text-2xl font-black font-['Archivo_Black'] text-[#14261B]">Smart Dustbin Portal Login</h2>
              <p className="text-xs text-gray-500 mt-1">
                College Internship & Municipal Corporation Demonstration Access
              </p>
            </div>

            {/* Current session info */}
            <div className="p-4 bg-emerald-50 rounded-xl border border-emerald-200 text-left text-xs space-y-1">
              <span className="text-[10px] font-mono text-emerald-800 uppercase font-bold">Currently Authenticated</span>
              <p className="font-bold text-sm text-[#14261B]">{currentUser.name} ({currentUser.role})</p>
              <p className="text-gray-600 font-mono text-[11px]">{currentUser.empId} • {currentUser.site}</p>
            </div>

            <div className="space-y-3">
              <p className="text-xs font-bold text-gray-700 uppercase tracking-wider text-left">
                1-Click Switch Demo User Role:
              </p>
              {demoRoles.map(r => (
                <button
                  key={r.empId}
                  onClick={() => {
                    setCurrentUser(r);
                    setIsLoggedIn(true);
                    showToast(`Logged in as ${r.name} (${r.role})`, 'success');
                    onNavigate('dashboard');
                  }}
                  className={`w-full p-3.5 rounded-xl border text-left flex items-center justify-between transition ${
                    currentUser.empId === r.empId
                      ? 'bg-[#123524] text-white border-[#123524] shadow'
                      : 'bg-gray-50 hover:bg-gray-100 text-gray-800'
                  }`}
                >
                  <div>
                    <p className="font-bold text-sm">{r.name}</p>
                    <p className={`text-xs ${currentUser.empId === r.empId ? 'text-[#C8E45C]' : 'text-gray-500'}`}>
                      {r.role} • {r.site}
                    </p>
                  </div>
                  <span className="text-xs font-bold font-mono">Select →</span>
                </button>
              ))}
            </div>

            <button
              onClick={() => onNavigate('dashboard')}
              className="w-full bg-[#123524] text-[#C8E45C] hover:bg-[#1b4933] font-bold text-xs py-3 rounded-xl transition"
            >
              Enter Monitoring Dashboard
            </button>
          </div>
        </div>
      );
    }

    // Render React Root
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
